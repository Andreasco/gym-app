<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym">
  <title>Gym</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" aria-label="Indietro" hidden>‹</button>
    <h1 id="title">Gym</h1>
    <span class="spacer"></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="timer" class="timer" hidden>
    <span>Recupero</span>
    <strong id="timer-value">0:00</strong>
    <button id="timer-minus" class="chip">−15s</button>
    <button id="timer-plus" class="chip">+15s</button>
    <button id="timer-stop" class="chip">Stop</button>
  </div>

  <nav class="tabbar">
    <a href="#/" data-tab="home">🏋️<span>Schede</span></a>
    <a href="#/history" data-tab="history">📈<span>Storico</span></a>
    <a href="#/library" data-tab="library">📚<span>Esercizi</span></a>
    <a href="#/settings" data-tab="settings">⚙️<span>Dati</span></a>
  </nav>

  <script src="app.js" type="module"></script>
</body>
</html>
